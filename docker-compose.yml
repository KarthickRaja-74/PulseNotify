services:
  postgres:
    image: postgres:17
    container_name: pulsenotify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: pulsenotify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pulsenotify-network

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pulsenotify-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pulsenotify.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - pulsenotify-network

volumes:
  postgres_data:

networks:
  pulsenotify-network:
    driver: bridge